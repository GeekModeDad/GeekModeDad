<footer class="site-footer">
  <div class="container">
    <div class="footer-brand">
      <span class="footer-logo">GEEKMODEDAD</span>
      <span class="footer-tagline">Comics &bull; Homelab &bull; Gadgets &bull; Collecting &bull; Dad Life</span>
    </div>
    <div class="footer-socials">
      {{ range .Site.Params.Social }}
      <a class="footer-btn" href="{{ .url }}" target="_blank" rel="noopener">{{ .name | upper }}</a>
      {{ end }}
    </div>
  </div>
</footer>
