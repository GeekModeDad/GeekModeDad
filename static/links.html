<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #282a36;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 8px;
    }

    ul {
      list-style: none;
    }

    li {
      margin-bottom: 6px;
    }

    a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      color: #f8f8f2;
      background: rgba(68, 71, 90, 0.4);
      transition: background 0.15s ease;
      font-size: 14px;
    }

    a:hover {
      background: rgba(189, 147, 249, 0.25);
      color: #bd93f9;
    }

    a::before {
      content: '→';
      color: #bd93f9;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <ul>
    <li><a href="https://www.geekmodedad.com" target="_blank">Geek Mode Dad</a></li>
    <li><a href="https://torrentday.it/t" target="_blank">TorrentDay</a></li>
  </ul>
</body>
</html>
